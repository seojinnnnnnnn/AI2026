        <script>
            // ... existing code ...
            function togglePlay() {
                const playIcon = document.getElementById('playIcon');
                
                if (isPlaying) {
                    // 일시 정지 로직
                    isPlaying = false;
                    playIcon.className = "fa-solid fa-play";
                    if (isVideoLoaded) video.pause();
                    stopSpeech();
                } else {
                    // 재생 로직
                    isPlaying = true;
                    playIcon.className = "fa-solid fa-pause";
                    
                    if (isVideoLoaded) {
                        // play()는 Promise를 반환하므로 .catch()로 실패 예외 처리
                        const playPromise = video.play();
                        if (playPromise !== undefined) {
                            playPromise.catch(error => {
                                console.warn("자동 재생이 차단되었습니다. 사용자의 클릭이 필요합니다.", error);
                                // 재생 실패 시 UI를 다시 정지 상태로 되돌림
                                isPlaying = false;
                                playIcon.className = "fa-solid fa-play";
                            });
                        }
                    }
                    
                    if (isTTSEnabled) {
                        speakCurrentSceneNarration(currentSceneId);
                    }
                }
            }

            function initVideoEvents() {
                video.addEventListener('loadedmetadata', () => {
                    isVideoLoaded = true;
                    // ... 기존 코드 ...
                });

                video.addEventListener('error', (e) => {
                    console.error("비디오 파일을 찾을 수 없습니다. 시뮬레이터 모드로 전환합니다.", e);
                    isVideoLoaded = false;
                    video.classList.add('hidden');
                    canvas.classList.remove('hidden');
                });
                
                // ... 기존 코드 ...
            }
            // ... 나머지 기존 코드 ...
        </script>
