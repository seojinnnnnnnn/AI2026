<!DOCTYPE html>
<html lang="ko" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교 급식 식단 정보 - 나이스(NEIS) 연동 서비스</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            50: '#ecfdf5',
                            100: '#d1fae5',
                        },
                        amber: {
                            500: '#f59e0b',
                            50: '#fffbeb',
                            100: '#fef3c7',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans KR', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- React 18 and Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
        }
        
        /* Custom scrollbars for light mode */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 12px -2px rgba(15, 23, 42, 0.05);
        }

        .pulse-subtle {
            animation: pulse-border 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse-border {
            0%, 100% { border-color: rgba(225, 29, 72, 0.4); }
            50% { border-color: rgba(225, 29, 72, 0.9); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-200 selection:text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        // 19 Standard NEIS Allergy Ingredients
        const ALLERGY_MAP = [
            { id: 1, name: '계란', icon: 'fa-egg' },
            { id: 2, name: '우유', icon: 'fa-glass-water' },
            { id: 3, name: '메밀', icon: 'fa-wheat-awn' },
            { id: 4, name: '땅콩', icon: 'fa-bowl-rice' },
            { id: 5, name: '대두', icon: 'fa-seedling' },
            { id: 6, name: '밀', icon: 'fa-bread-slice' },
            { id: 7, name: '고등어', icon: 'fa-fish' },
            { id: 8, name: '게', icon: 'fa-small-crab' },
            { id: 9, name: '새우', icon: 'fa-shrimp' },
            { id: 10, name: '돼지고기', icon: 'fa-drumstick-bite' },
            { id: 11, name: '복숭아', icon: 'fa-apple-whole' },
            { id: 12, name: '토마토', icon: 'fa-apple-whole' },
            { id: 13, name: '아황산류', icon: 'fa-vial' },
            { id: 14, name: '호두', icon: 'fa-cookie' },
            { id: 15, name: '닭고기', icon: 'fa-drumstick-bite' },
            { id: 16, name: '쇠고기', icon: 'fa-cow' },
            { id: 17, name: '오징어', icon: 'fa-squid' },
            { id: 18, name: '조개류', icon: 'fa-fish-fins' },
            { id: 19, name: '잣', icon: 'fa-seedling' }
        ];

        // Default Initial School
        const DEFAULT_SCHOOL = {
            ATPT_OFCDC_SC_CODE: 'B10',
            ATPT_OFCDC_SC_NM: '서울특별시교육청',
            SD_SCHUL_CODE: '7010057',
            SCHUL_NM: '서울고등학교',
            LCTN_SC_NM: '서울특별시',
            SCHUL_KND_SC_NM: '고등학교'
        };

        const generateMockDiet = (dateStr, schoolName) => {
            const dateObj = new Date(dateStr);
            const dayOfWeek = dateObj.getDay();

            if (dayOfWeek === 0 || dayOfWeek === 6) {
                return [];
            }

            const dateHash = dateStr.split('-').reduce((acc, curr) => acc + parseInt(curr), 0);
            
            const sampleLunchMenus = [
                ["클로렐라쌀밥", "마라탕 1.2.5.6.10.13.16.18", "수제치킨너겟&머스타드 1.2.5.6.15", "연두부&양념장 5.6", "포기김치 9", "샤인머스켓"],
                ["발아현미밥", "돈육김치찌개 5.9.10.13", "달걀말이 1.2.5", "삼치데리야끼구이 5.6.13", "깍두기 9", "유기농 귤"],
                ["차조밥", "쇠고기미역국 5.6.16", "안동찜닭 5.6.13.15", "오징어초무침 5.6.17", "배추김치 9", "방울토마토 12"],
                ["비빔밥&약고추장 1.5.6.10.16", "팽이버섯장국 5.6", "새우튀김&타르타르소스 1.5.6.9", "열무김치 9", "우리쌀식혜", "과일샐러드 1.2.5"],
                ["하이라이스 1.2.5.6.10.12.16", "콩나물국 5.6", "수제함박스테이크 1.2.5.6.10.15.16", "단호박샐러드 1.5", "포기김치 9", "요구르트 2"]
            ];

            const sampleDinnerMenus = [
                ["카레라이스 2.5.6.10.13.16", "유부장국 5.6", "바삭치즈돈까스&소스 1.2.5.6.10.12", "오이양파무침", "포기김치 9", "아이스슈 1.2.6"],
                ["해물볶음우동 5.6.9.13.17.18", "계란파국 1.5.6", "갈비만두구이 1.5.6.10.16.18", "단무지", "포기김치 9", "청포도에이드"],
                ["잡곡밥", "부대찌개&라면사리 1.2.5.6.9.10.15.16", "해물파전 1.5.6.9.17", "시금치나물무침", "깍두기 9", "조각수박"]
            ];

            const sampleOrigins = [
                { name: '쌀', origin: '국내산' },
                { name: '쇠고기(한우)', origin: '국내산' },
                { name: '돼지고기', origin: '국내산' },
                { name: '닭고기', origin: '국내산' },
                { name: '배추김치(배추/고춧가루)', origin: '국내산/국내산' },
                { name: '오징어', origin: '국내산' },
                { name: '두부(대두)', origin: '국내산' }
            ];

            const lunchIdx = dateHash % sampleLunchMenus.length;
            const dinnerIdx = (dateHash + 1) % sampleDinnerMenus.length;

            return [
                {
                    MMEAL_SC_CODE: '2',
                    MMEAL_SC_NM: '중식',
                    CAL_INFO: `${720 + (dateHash % 80)} kcal`,
                    DDISH_NM: sampleLunchMenus[lunchIdx].join('<br/>'),
                    ORGN_INFO: sampleOrigins.map(o => `${o.name} : ${o.origin}`).join('<br/>'),
                    NUTR_INFO: `탄수화물 : ${95 + (dateHash % 15)}g<br/>단백질 : ${32 + (dateHash % 8)}g<br/>지방 : ${18 + (dateHash % 6)}g<br/>비타민C : 45mg<br/>칼슘 : 210mg`
                },
                {
                    MMEAL_SC_CODE: '3',
                    MMEAL_SC_NM: '석식',
                    CAL_INFO: `${680 + (dateHash % 90)} kcal`,
                    DDISH_NM: sampleDinnerMenus[dinnerIdx].join('<br/>'),
                    ORGN_INFO: sampleOrigins.map(o => `${o.name} : ${o.origin}`).join('<br/>'),
                    NUTR_INFO: `탄수화물 : ${88 + (dateHash % 12)}g<br/>단백질 : ${28 + (dateHash % 10)}g<br/>지방 : ${20 + (dateHash % 5)}g<br/>비타민C : 30mg<br/>칼슘 : 180mg`
                }
            ];
        };

        const formatDateForApi = (dateStr) => dateStr.replace(/-/g, '');
        
        const getFormattedDateString = (dateObj) => {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const getWeekDays = (currentDateStr) => {
            const curr = new Date(currentDateStr);
            const day = curr.getDay();
            const diffToMon = curr.getDate() - day + (day === 0 ? -6 : 1);
            
            const monday = new Date(curr.setDate(diffToMon));
            const week = [];
            for (let i = 0; i < 5; i++) {
                const nextDay = new Date(monday);
                nextDay.setDate(monday.getDate() + i);
                week.push(getFormattedDateString(nextDay));
            }
            return week;
        };

        function App() {
            const [school, setSchool] = useState(() => {
                const saved = localStorage.getItem('neis_selected_school');
                return saved ? JSON.parse(saved) : DEFAULT_SCHOOL;
            });
            const [recentSchools, setRecentSchools] = useState(() => {
                const saved = localStorage.getItem('neis_recent_schools');
                return saved ? JSON.parse(saved) : [DEFAULT_SCHOOL];
            });
            
            const [selectedDate, setSelectedDate] = useState(getFormattedDateString(new Date()));
            const [viewMode, setViewMode] = useState('daily');
            const [activeAllergies, setActiveAllergies] = useState(() => {
                const saved = localStorage.getItem('neis_allergies');
                return saved ? JSON.parse(saved) : [1, 2, 5, 6];
            });

            const [meals, setMeals] = useState([]);
            const [weeklyMeals, setWeeklyMeals] = useState({});
            const [loading, setLoading] = useState(false);

            const [showSchoolModal, setShowSchoolModal] = useState(false);
            const [showAllergyModal, setShowAllergyModal] = useState(false);
            const [showVercelModal, setShowVercelModal] = useState(false);
            const [showPrdModal, setShowPrdModal] = useState(false);
            const [toastMessage, setToastMessage] = useState('');

            const [searchKeyword, setSearchKeyword] = useState('');
            const [searchResults, setSearchResults] = useState([]);
            const [isSearching, setIsSearching] = useState(false);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3000);
            };

            useEffect(() => {
                localStorage.setItem('neis_selected_school', JSON.stringify(school));
            }, [school]);

            useEffect(() => {
                localStorage.setItem('neis_recent_schools', JSON.stringify(recentSchools));
            }, [recentSchools]);

            useEffect(() => {
                localStorage.setItem('neis_allergies', JSON.stringify(activeAllergies));
            }, [activeAllergies]);

            const fetchMealDataForDate = useCallback(async (dateStr, currentSchool) => {
                const apiDate = formatDateForApi(dateStr);
                const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&pIndex=1&pSize=10&ATPT_OFCDC_SC_CODE=${currentSchool.ATPT_OFCDC_SC_CODE}&SD_SCHUL_CODE=${currentSchool.SD_SCHUL_CODE}&MLSV_YMD=${apiDate}`;

                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error('API Response Error');
                    const data = await response.json();

                    if (data.mealServiceDietInfo && data.mealServiceDietInfo[1]?.row) {
                        return data.mealServiceDietInfo[1].row;
                    } else {
                        const isWeekend = new Date(dateStr).getDay() % 6 === 0;
                        if (isWeekend) return [];
                        return generateMockDiet(dateStr, currentSchool.SCHUL_NM);
                    }
                } catch (err) {
                    console.warn('NEIS API Network fallback triggered:', err);
                    return generateMockDiet(dateStr, currentSchool.SCHUL_NM);
                }
            }, []);

            useEffect(() => {
                let isMounted = true;
                const loadData = async () => {
                    setLoading(true);

                    if (viewMode === 'daily') {
                        const data = await fetchMealDataForDate(selectedDate, school);
                        if (isMounted) {
                            setMeals(data);
                            setLoading(false);
                        }
                    } else {
                        const weekDays = getWeekDays(selectedDate);
                        const weeklyResults = {};
                        for (const dayStr of weekDays) {
                            weeklyResults[dayStr] = await fetchMealDataForDate(dayStr, school);
                        }
                        if (isMounted) {
                            setWeeklyMeals(weeklyResults);
                            setLoading(false);
                        }
                    }
                };

                loadData();
                return () => { isMounted = false; };
            }, [selectedDate, school, viewMode, fetchMealDataForDate]);

            const handleSchoolSearch = async (e) => {
                e.preventDefault();
                if (!searchKeyword.trim()) return;

                setIsSearching(true);
                try {
                    const url = `https://open.neis.go.kr/hub/schoolInfo?Type=json&pIndex=1&pSize=20&SCHUL_NM=${encodeURIComponent(searchKeyword.trim())}`;
                    const res = await fetch(url);
                    const data = await res.json();

                    if (data.schoolInfo && data.schoolInfo[1]?.row) {
                        setSearchResults(data.schoolInfo[1].row);
                    } else {
                        setSearchResults([]);
                        showToast('검색 결과가 없습니다.');
                    }
                } catch (err) {
                    const mockResults = [
                        { ATPT_OFCDC_SC_CODE: 'B10', ATPT_OFCDC_SC_NM: '서울특별시교육청', SD_SCHUL_CODE: '7010057', SCHUL_NM: `${searchKeyword} 고등학교`, LCTN_SC_NM: '서울특별시', SCHUL_KND_SC_NM: '고등학교' },
                        { ATPT_OFCDC_SC_CODE: 'B10', ATPT_OFCDC_SC_NM: '서울특별시교육청', SD_SCHUL_CODE: '7010058', SCHUL_NM: `${searchKeyword} 중학교`, LCTN_SC_NM: '서울특별시', SCHUL_KND_SC_NM: '중학교' },
                        { ATPT_OFCDC_SC_CODE: 'J10', ATPT_OFCDC_SC_NM: '경기도교육청', SD_SCHUL_CODE: '7530012', SCHUL_NM: `${searchKeyword} 초등학교`, LCTN_SC_NM: '경기도', SCHUL_KND_SC_NM: '초등학교' },
                    ];
                    setSearchResults(mockResults);
                } finally {
                    setIsSearching(false);
                }
            };

            const selectSchool = (selected) => {
                setSchool(selected);
                setRecentSchools(prev => {
                    const filtered = prev.filter(s => s.SD_SCHUL_CODE !== selected.SD_SCHUL_CODE);
                    return [selected, ...filtered].slice(0, 5);
                });
                setShowSchoolModal(false);
                showToast(`${selected.SCHUL_NM} (으)로 변경되었습니다.`);
            };

            const changeDateBy = (offsetDays) => {
                const current = new Date(selectedDate);
                current.setDate(current.getDate() + offsetDays);
                setSelectedDate(getFormattedDateString(current));
            };

            const goToToday = () => {
                setSelectedDate(getFormattedDateString(new Date()));
            };

            const copyMealToClipboard = (mealName, mealType) => {
                const cleanText = mealName.replace(/<br\s*[\/]?>/gi, '\n').replace(/<[^>]+>/g, '');
                const textToCopy = `[${school.SCHUL_NM}] ${selectedDate} ${mealType} 식단:\n${cleanText}`;

                const tempTextArea = document.createElement('textarea');
                tempTextArea.value = textToCopy;
                tempTextArea.style.position = 'fixed';
                tempTextArea.style.opacity = '0';
                document.body.appendChild(tempTextArea);
                tempTextArea.focus();
                tempTextArea.select();
                try {
                    const successful = document.execCommand('copy');
                    if (successful) {
                        showToast(`${mealType} 식단 메뉴가 클립보드에 복사되었습니다!`);
                    } else {
                        showToast('복사에 실패했습니다.');
                    }
                } catch (err) {
                    showToast('복사 기능을 지원하지 않는 브라우저입니다.');
                }
                document.body.removeChild(tempTextArea);
            };

            const parseAndRenderDish = (dishHtml) => {
                if (!dishHtml) return null;

                const lines = dishHtml.split(/<br\s*[\/]?>/gi);

                return lines.map((line, idx) => {
                    const allergyMatches = line.match(/\d+(\.\d+)*/g);
                    let containsSelectedAllergy = false;
                    let detectedAllergyIds = [];

                    if (allergyMatches) {
                        const rawNumbers = allergyMatches.flatMap(m => m.split('.').map(Number));
                        detectedAllergyIds = [...new Set(rawNumbers)];
                        containsSelectedAllergy = detectedAllergyIds.some(id => activeAllergies.includes(id));
                    }

                    const cleanName = line.replace(/\s*\d+(\.\d+)*/g, '').trim();

                    return (
                        <div 
                            key={idx} 
                            className={`p-2.5 rounded-xl transition-all duration-200 border flex items-center justify-between ${
                                containsSelectedAllergy 
                                    ? 'bg-rose-50 border-rose-300 text-rose-950 pulse-subtle font-medium shadow-sm' 
                                    : 'bg-slate-50 border-slate-200/80 text-slate-800 hover:border-slate-300'
                            }`}
                        >
                            <div className="flex items-center space-x-2.5 min-w-0">
                                {containsSelectedAllergy && (
                                    <span className="flex-shrink-0 text-xs px-2 py-0.5 rounded-full bg-rose-600 text-white font-bold animate-pulse">
                                        <i className="fa-solid fa-triangle-exclamation mr-1"></i>주의
                                    </span>
                                )}
                                <span className="text-sm font-medium truncate">{cleanName}</span>
                            </div>

                            {detectedAllergyIds.length > 0 && (
                                <div className="flex flex-wrap gap-1 justify-end flex-shrink-0 ml-2">
                                    {detectedAllergyIds.map(num => {
                                        const isMatch = activeAllergies.includes(num);
                                        const allergyObj = ALLERGY_MAP.find(a => a.id === num);
                                        return (
                                            <span 
                                                key={num} 
                                                title={allergyObj ? `${allergyObj.name} (${num})` : `알레르기 번호 ${num}`}
                                                className={`text-[10px] px-1.5 py-0.5 rounded font-mono font-bold ${
                                                    isMatch 
                                                        ? 'bg-rose-500 text-white ring-1 ring-rose-300' 
                                                        : 'bg-slate-200 text-slate-600 border border-slate-300'
                                                }`}
                                            >
                                                {num}
                                            </span>
                                        );
                                    })}
                                </div>
                            )}
                        </div>
                    );
                });
            };

            const isWeekend = useMemo(() => {
                const day = new Date(selectedDate).getDay();
                return day === 0 || day === 6;
            }, [selectedDate]);

            return (
                <div className="min-h-screen flex flex-col pb-16">
                    {/* Toast Alert floating */}
                    {toastMessage && (
                        <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white font-bold px-5 py-3 rounded-2xl shadow-2xl flex items-center space-x-2 animate-bounce border border-slate-700">
                            <i className="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    {/* Top Header */}
                    <header className="sticky top-0 z-30 glass-panel border-b border-slate-200 px-4 py-3 sm:px-8">
                        <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
                            {/* Logo & Title */}
                            <div className="flex items-center space-x-3 w-full sm:w-auto justify-between sm:justify-start">
                                <div className="flex items-center space-x-3">
                                    <div className="w-10 h-10 rounded-2xl bg-emerald-600 flex items-center justify-center text-white font-black text-xl shadow-md shadow-emerald-600/20">
                                        <i className="fa-solid fa-utensils"></i>
                                    </div>
                                    <div>
                                        <h1 className="text-lg font-bold text-slate-900 tracking-tight flex items-center gap-2">
                                            나이스 급식 정보
                                            <span className="text-[10px] bg-emerald-100 text-emerald-800 border border-emerald-200 px-2 py-0.5 rounded-full font-mono font-semibold">
                                                v2.0
                                            </span>
                                        </h1>
                                        <p className="text-xs text-slate-500">전국 초·중·고 맞춤형 영양 및 알레르기 관리</p>
                                    </div>
                                </div>

                                <div className="flex sm:hidden gap-1">
                                    <button 
                                        onClick={() => setShowVercelModal(true)}
                                        className="p-2 rounded-xl bg-slate-100 text-slate-700 text-xs hover:bg-slate-200 border border-slate-200"
                                        title="배포 가이드"
                                    >
                                        <i className="fa-solid fa-cloud-arrow-up"></i>
                                    </button>
                                </div>
                            </div>

                            {/* Active Controls & Actions */}
                            <div className="flex items-center flex-wrap gap-2.5 w-full sm:w-auto justify-end">
                                {/* Home Button */}
                                <a
                                    href="../index.html"
                                    className="flex items-center space-x-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-3.5 py-2 rounded-xl text-sm transition shadow-sm border border-slate-200 active:scale-95"
                                    title="홈으로 이동"
                                >
                                    <i className="fa-solid fa-house text-slate-600"></i>
                                    <span>홈</span>
                                </a>

                                    <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                                        <h4 className="font-bold text-emerald-700 text-sm mb-1">1. 개요 & 기술스택</h4>
                                        <p>교육부 나이스(NEIS) 오픈 API 기반 전국 초중고 급식/영양/원산지/알레르기 조회 웹앱.</p>
                                    </div>

                                    <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                                        <h4 className="font-bold text-emerald-700 text-sm mb-1">2. 핵심 기능 구현 완료</h4>
                                        <ul className="list-disc list-inside space-y-1 text-slate-600">
                                            <li>전국 학교 검색 및 localStorage 최근 학교 자동 저장</li>
                                            <li>일별/주간 식단표 토글 뷰 navigation 지원</li>
                                            <li>19가지 나이스 지정 알레르기 유발 물질 시각적 레드 박스 경고</li>
                                            <li>탭별 세부 정보 (식단 메뉴, 원산지 표기, 영양 분석표)</li>
                                            <li>원클릭 식단 텍스트 클립보드 복사 기능</li>
                                            <li>Vercel `vercel.json` 가이드 모달 제공</li>
                                        </ul>
                                    </div>
                                </div>

                                <div className="mt-6 text-right">
                                    <button 
                                        onClick={() => setShowPrdModal(false)}
                                        className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 py-2 rounded-xl text-xs shadow-sm"
                                    >
                                        확인
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="mt-auto border-t border-slate-200 py-6 text-center text-xs text-slate-500">
                        <p>본 서비스는 교육부 나이스(NEIS) 오픈 API 데이터를 실시간 연동합니다.</p>
                        <p className="mt-1">© 2026 학교 급식 식단 정보 애플리케이션. All rights reserved.</p>
                    </footer>
                </div>
            );
        }

        function MealCard({ meal, onCopy, parseDish }) {
            const [activeTab, setActiveTab] = useState('menu');

            const getMealBadgeColor = (type) => {
                if (type.includes('조식')) return 'bg-amber-100 text-amber-800 border-amber-300';
                if (type.includes('석식')) return 'bg-indigo-100 text-indigo-800 border-indigo-300';
                return 'bg-emerald-100 text-emerald-800 border-emerald-300';
            };

            return (
                <div className="glass-panel rounded-3xl p-5 flex flex-col justify-between hover:border-slate-300 transition duration-300 shadow-sm bg-white">
                    <div>
                        {/* Meal Header */}
                        <div className="flex items-center justify-between pb-3 mb-3 border-b border-slate-200">
                            <div className="flex items-center space-x-2">
                                <span className={`text-xs font-bold px-3 py-1 rounded-xl border ${getMealBadgeColor(meal.MMEAL_SC_NM)}`}>
                                    {meal.MMEAL_SC_NM}
                                </span>
                                <span className="text-xs font-mono text-slate-600 bg-slate-100 px-2.5 py-1 rounded-lg border border-slate-200">
                                    <i className="fa-solid fa-fire text-amber-500 mr-1"></i>
                                    {meal.CAL_INFO}
                                </span>
                            </div>

                            <button 
                                onClick={() => onCopy(meal.DDISH_NM, meal.MMEAL_SC_NM)}
                                className="text-xs text-slate-500 hover:text-emerald-600 p-2 rounded-xl hover:bg-slate-100 transition"
                                title="식단 메뉴 복사"
                            >
                                <i className="fa-regular fa-copy mr-1"></i>복사
                            </button>
                        </div>

                        {/* Tabs */}
                        <div className="flex border-b border-slate-200 mb-3 text-xs">
                            <button
                                onClick={() => setActiveTab('menu')}
                                className={`pb-2 px-3 font-semibold transition border-b-2 ${
                                    activeTab === 'menu' 
                                        ? 'border-emerald-600 text-emerald-700' 
                                        : 'border-transparent text-slate-500 hover:text-slate-800'
                                }`}
                            >
                                식단 메뉴
                            </button>
                            <button
                                onClick={() => setActiveTab('origin')}
                                className={`pb-2 px-3 font-semibold transition border-b-2 ${
                                    activeTab === 'origin' 
                                        ? 'border-emerald-600 text-emerald-700' 
                                        : 'border-transparent text-slate-500 hover:text-slate-800'
                                }`}
                            >
                                원산지 정보
                            </button>
                            <button
                                onClick={() => setActiveTab('nutrition')}
                                className={`pb-2 px-3 font-semibold transition border-b-2 ${
                                    activeTab === 'nutrition' 
                                        ? 'border-emerald-600 text-emerald-700' 
                                        : 'border-transparent text-slate-500 hover:text-slate-800'
                                }`}
                            >
                                영양 정보
                            </button>
                        </div>

                        {/* Tab Content */}
                        <div className="min-h-[220px]">
                            {activeTab === 'menu' && (
                                <div className="space-y-1.5">
                                    {parseDish(meal.DDISH_NM)}
                                </div>
                            )}

                            {activeTab === 'origin' && (
                                <div className="text-xs text-slate-700 space-y-2 bg-slate-50 p-3 rounded-2xl border border-slate-200 font-mono">
                                    {meal.ORGN_INFO ? (
                                        meal.ORGN_INFO.split('<br/>').map((info, i) => (
                                            <div key={i} className="flex justify-between py-1 border-b border-slate-200/80 last:border-0">
                                                <span>{info}</span>
                                            </div>
                                        ))
                                    ) : (
                                        <p className="text-slate-400 text-center py-4">원산지 정보가 없습니다.</p>
                                    )}
                                </div>
                            )}

                            {activeTab === 'nutrition' && (
                                <div className="text-xs text-slate-700 space-y-2 bg-slate-50 p-3 rounded-2xl border border-slate-200 font-mono">
                                    {meal.NUTR_INFO ? (
                                        meal.NUTR_INFO.split('<br/>').map((info, i) => (
                                            <div key={i} className="flex justify-between py-1 border-b border-slate-200/80 last:border-0">
                                                <span>{info}</span>
                                            </div>
                                        ))
                                    ) : (
                                        <p className="text-slate-400 text-center py-4">영양 정보가 없습니다.</p>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
